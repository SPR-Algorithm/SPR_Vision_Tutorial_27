# Bevy Talos v2, RGB8 1440x1080. Runtime CameraInfo overrides these intrinsics.
enemy_color: blue
min_detect_count: 3
max_temp_lost_count: 15
outpost_max_temp_lost_count: 75
only_outpost: false
# TODO(学生): 在此添加自己的滤波参数，并在 Target/Tracker 中读取。

yolo_name: yolov5
yolov5_model_path: assets/yolov5.xml
device: CPU
threshold: 100
min_confidence: 0.45
use_traditional: false
use_roi: false
roi: { x: 0, y: 0, width: -1, height: -1 }

R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]
R_camera2gimbal: [0, 0, 1, -1, 0, 0, 0, -1, 0]
t_camera2gimbal: [0, 0, 0]
camera_matrix: [1303.68, 0, 720, 0, 1303.68, 540, 0, 0, 1]
distort_coeffs: [0, 0, 0, 0, 0]

sim:
  shm_directory: /tmp
  max_frame_age_ms: 1000 #100
  control: true
  fire: true
  bullet_speed: 24.9
  execution_delay_ms: 0
  duration_s: 0

  
planner:
  yaw_offset: 0.0 # degrees
  pitch_offset: 0.0
  max_yaw_acc: 100.0 # rad/s^2
  max_pitch_acc: 50.0
  Q_yaw: [9e6, 0]
  R_yaw: [1]
  Q_pitch: [9e6, 0]
  R_pitch: [1]
  max_iter: 100
  solver_tolerance: 0.0001
  fire_thresh: 0.35 # MPC angular tracking error, radians
  visibility_limit_deg: 45.0
shooter:
  yaw_tolerance_deg: 0.8
  pitch_tolerance_deg: 0.6
  visibility_angle_deg: 45.0
  fire_interval_ms: 80.0
  settle_time_ms: 20.0
foxglove:
  enabled: true 
  host: 127.0.0.1
  port: 8765
  rate_hz: 50
  visual_rate_hz: 10
plotjuggler:
  enabled: false
  host: 127.0.0.1
  port: 9870
  rate_hz: 100

# Mọi khóa đều có giá trị mặc định trong code, chỉ ghi những gì muốn đổi.

target:
  mode: outpost            # plate = Task 1 (tịnh tiến) | outpost = Task 2 (tiền đồn)
  output_mode: predict   # raw | filter | predict  -> 3 chế độ so sánh của Task 1

  # ---- nhiễu quan sát (chung) ----
  fx: 1400.0             # lấy từ camera_matrix (px). BẮT BUỘC đặt đúng
  sigma_pix: 1.0
  plate_width: 0.135     # giáp nhỏ (m)
  depth_scale: 1.0       # hiệu chỉnh sai số chiều sâu sau khi đo
  sigma_floor: 0.01      # m
  R_yaw: 0.0225          # rad² (Task 1 bạn từng đo 0.0001, hãy dùng số đo của bạn)
  use_yaw: true          # false nếu yaw PnP của bạn nhiễu/lật -> chỉ dùng xyz
  gate_chi2: 9.49        # 4 bậc tự do
  gate_chi2_3dof: 7.81   # khi use_yaw=false
  # reset_dt: 0.3        # mặc định 0.3 (plate) / 0.6 (outpost)
  max_predict_s: 1.0     # >= tầm nhìn xa nhất mà Planner hỏi

  # ---- Task 1: nhiễu gia tốc σ_a² ((m/s²)²) ----
  sa2_x: 2.0
  sa2_y: 2.0
  sa2_z: 0.5
  sa2_yaw: 0.5

  # ---- Task 2: tiền đồn ----
  r0: 0.275              # m. ĐO LẠI trên thiết bị thật
  sigma_alpha: 30.0      # rad/s². Nhỏ: mượt nhưng trễ khi dừng/đảo chiều; lớn: bám nhanh nhưng nhiễu
  q_center: 0.001
  q_r: 0.001
  q_z: 0.001
  outpost_class_id: -1   # >=0: chỉ nhận giáp có class_id của tiền đồn
  yaw_flip: false        # true nếu yaw của Solver hướng VÀO trong

tracker:
  max_lost_time_s: 0.2   # thời gian bám mù tối đa
  confirm_frames: 3      # số frame liên tiếp để xác nhận mục tiêu

# task2_real
fire_enabled: false      # thử nghiệm: tắt bắn