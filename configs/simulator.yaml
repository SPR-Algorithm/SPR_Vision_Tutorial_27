# Bevy Talos v2, RGB8 1440x1080. Runtime CameraInfo overrides these intrinsics.
enemy_color: blue
min_detect_count: 3
max_temp_lost_count: 15
outpost_max_temp_lost_count: 75
only_outpost: false
# TODO(学生): 在此添加自己的滤波参数，并在 Target/Tracker 中读取。

yolo_name: yolov5
yolov5_model_path: assets/yolov5.xml
device: CPU
threshold: 100
min_confidence: 0.45
use_traditional: false
use_roi: false
roi: { x: 0, y: 0, width: -1, height: -1 }

R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]
R_camera2gimbal: [0, 0, 1, -1, 0, 0, 0, -1, 0]
t_camera2gimbal: [0, 0, 0]
camera_matrix: [1303.68, 0, 720, 0, 1303.68, 540, 0, 0, 1]
distort_coeffs: [0, 0, 0, 0, 0]

sim:
  shm_directory: /tmp
  max_frame_age_ms: 1000 #100
  control: true
  fire: true
  bullet_speed: 24.9
  execution_delay_ms: 0
  duration_s: 0

  
planner:
  yaw_offset: 0.0 # degrees
  pitch_offset: 0.0
  max_yaw_acc: 100.0 # rad/s^2
  max_pitch_acc: 50.0
  Q_yaw: [9e6, 0]
  R_yaw: [1]
  Q_pitch: [9e6, 0]
  R_pitch: [1]
  max_iter: 100
  solver_tolerance: 0.0001
  fire_thresh: 0.35 # MPC angular tracking error, radians
  visibility_limit_deg: 45.0
shooter:
  yaw_tolerance_deg: 0.8
  pitch_tolerance_deg: 0.6
  visibility_angle_deg: 45.0
  fire_interval_ms: 80.0
  settle_time_ms: 20.0
foxglove:
  enabled: true 
  host: 127.0.0.1
  port: 8765
  rate_hz: 50
  visual_rate_hz: 10
plotjuggler:
  enabled: false
  host: 127.0.0.1
  port: 9870
  rate_hz: 100

# Mọi khóa đều có giá trị mặc định trong code, chỉ ghi những gì muốn đổi.

target:
  mode: outpost            # plate | outpost | auto (auto: giáp có name == outpost thì dùng outpost)
  output_mode: predict     # raw | filter | predict

  # ---- nhiễu quan sát ----
  fx: 1303.68              # sim 1303.68; xe thật 2348.28
  sigma_pix: 1.0
  plate_width: 0.135
  depth_scale: 1.0
  sigma_floor: 0.01
  R_yaw: 0.01
  use_yaw: true
  gate_chi2: 13.28         # 4 bậc, 99%. (95% = 9.49)
  gate_chi2_3dof: 11.34

  # ---- plate (Task 1) ----
  sa2_x: 2.0
  sa2_y: 8.0
  sa2_z: 0.5
  sa2_yaw: 0.5

  # ---- outpost (Task 2) ----
  r0: 0.275
  sigma_alpha: 30.0        # rad/s². chưa rõ đơn vị phương sai hay độ lệch chuẩn
  q_center: 0.001          # tâm quay đứng yên: GIỮ NHỎ
  outpost_by_name: true    # chỉ nhận giáp có name == ArmorName::outpost
  outpost_class_id: -1
  yaw_flip: false

  # ---- hình học đã biết. TÙY CHỌN, đọc cảnh báo trước khi bật ----
  # fix_geometry: true
  # plate_heights: [-0.102, 0.0, 0.120]   # CHƯA kiểm chứng với bản vẽ/thiết bị
  # center_z_prior: 1.216        # cao độ tâm trong world: phụ thuộc chiều cao gimbal TẠM: thay bằng 1.216 - (độ cao gimbal so với mặt bệ xám). ĐO LẠI
  # plate_angles_deg: [0, 120, 240]

tracker:
  max_lost_time_s: 0.5
  confirm_frames: 3