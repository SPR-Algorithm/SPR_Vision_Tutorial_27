enemy_color: "red"
#enemy_color: "blue"

#####-----神经网络参数-----#####
yolo_name: yolov5
classify_model: assets/tiny_resnet.onnx
yolo11_model_path: assets/yolo11.xml
yolov8_model_path: assets/yolov8.xml
yolov5_model_path: assets/yolov5.xml
device: CPU
min_confidence: 0.8
use_traditional: false

#####-----ROI-----#####
roi:
  x: 420
  y: 50
  width: 600
  height: 600

use_roi: false

#####-----tracker参数-----#####
min_detect_count: 5
max_temp_lost_count: 15
outpost_max_temp_lost_count: 75

#####-----aimer参数-----#####
yaw_offset: 0.5 # degree -2.5
pitch_offset: -1.5 # degree 2

camera_name: "hikrobot"
exposure_ms: 2
gain: 16.0
vid_pid: "2bdf:0001"

#  1  0  0
#  0  1  0
#  0  0  1

R_gimbal2imubody: [0, 1, 0, -1, 0, 0, 0, 0, -1]

# # 重投影误差: 0.214px
camera_matrix:
  [
    2348.28807,
    0.00000,
    715.8871,
    0.000000,
    2343.20121,
    549.08769,
    0.00000,
    0.00000,
    1.00000,
  ]
distort_coeffs: [-0.113753, 0.476220, -0.000367, 0.000390, 0.000000]

# 相机同理想情况的偏角: yaw0.50 pitch0.89 roll-4.09 degree
# 标定板到世界坐标系原点的水平距离: 1.84 m
# 标定板同竖直摆放时的偏角: yaw21.15 pitch5.80 roll-95.22 degree
R_camera2gimbal:
  [
    -0.0097593608923142363,
    0.014906909346876499,
    0.9998412568646573,
    -0.99740747610409053,
    -0.07143632359391644,
    -0.0086705411049835795,
    0.0712957325976913,
    -0.99733376345389468,
    0.015565435690953719,
  ]
t_camera2gimbal:
  [0.02663681156986614, -0.00018454730148609257, 0.10511518672308437]

#####-----gimbal参数-----#####
com_port: "/dev/ttyUSB0"

#####-----buff_detector参数-----#####
model: "assets/buffer-0624.xml"

#####-----buff_aimer参数-----#####
fire_gap_time: 0.520 # s
predict_time: 0.100 # s

#####----- Hardware & Latency -----#####
execution_delay_ms: 20.0
t_gimbal_muzzle: [0.0, 0.0, 0.0] 

#####-----planner-----#####
fire_thresh: 0.0035

max_yaw_acc: 50
Q_yaw: [9e6, 0]
R_yaw: [1]

max_pitch_acc: 100
Q_pitch: [9e6, 0]
R_pitch: [1]

# Mọi khóa đều có mặc định trong code.

target:
  mode: outpost            # plate | outpost | auto (auto: giáp có name == outpost thì dùng outpost)
  output_mode: predict     # raw | filter | predict

  # ---- nhiễu quan sát ----
  fx: 1303.68              # sim 1303.68; xe thật 2348.28
  sigma_pix: 1.0
  plate_width: 0.135
  depth_scale: 1.0
  sigma_floor: 0.01
  R_yaw: 0.01
  use_yaw: true
  gate_chi2: 13.28         # 4 bậc, 99%. (95% = 9.49)
  gate_chi2_3dof: 11.34

  # ---- plate (Task 1) ----
  sa2_x: 2.0
  sa2_y: 8.0
  sa2_z: 0.5
  sa2_yaw: 0.5

  # ---- outpost (Task 2) ----
  r0: 0.275
  sigma_alpha: 30.0        # rad/s². chưa rõ đơn vị phương sai hay độ lệch chuẩn
  q_center: 0.001          # tâm quay đứng yên: GIỮ NHỎ
  outpost_by_name: true    # chỉ nhận giáp có name == ArmorName::outpost
  outpost_class_id: -1
  yaw_flip: false

  # ---- hình học đã biết. TÙY CHỌN, đọc cảnh báo trước khi bật ----
  # fix_geometry: true
  # plate_heights: [-0.102, 0.0, 0.102]   # thứ tự mảng cần khớp với quy ước đánh chỉ số tấm giáp trong model EKF 
  # center_z_prior: 1.216        # cao độ tâm trong world: phụ thuộc chiều cao gimbal TẠM: thay bằng 1.216 - (độ cao gimbal so với mặt bệ xám). ĐO LẠI
  # plate_angles_deg: [0, 120, 240]

tracker:
  max_lost_time_s: 0.5
  confirm_frames: 3