enemy_color: "red"
#enemy_color: "blue"

# com_port: "/dev/ttyUSB0"
# baud_rate: 1000000   

#####-----神经网络参数-----#####
yolo_name: yolov5
classify_model: assets/tiny_resnet.onnx
yolo11_model_path: assets/yolo11.xml
yolov8_model_path: assets/yolov8.xml
yolov5_model_path: assets/yolov5.xml
device: CPU
min_confidence: 0.8
use_traditional: false

#####-----ROI-----#####
roi:
  x: 420
  y: 50
  width: 600
  height: 600

use_roi: false

#####-----tracker参数-----#####
min_detect_count: 5
max_temp_lost_count: 15
outpost_max_temp_lost_count: 75

#####-----aimer参数-----#####
yaw_offset: 0.5 # degree -2.5
pitch_offset: -1.5 # degree 2

camera_name: "hikrobot"
exposure_ms: 5
gain: 16.0
vid_pid: "2bdf:0001"
flip_code: 2

#  1  0  0
#  0  1  0
#  0  0  1

R_gimbal2imubody: [0, 1, 0, -1, 0, 0, 0, 0, -1]

# # 重投影误差: 0.214px
camera_matrix:
  [
    2348.28807,
    0.00000,
    715.8871,
    0.000000,
    2343.20121,
    549.08769,
    0.00000,
    0.00000,
    1.00000,
  ]
distort_coeffs: [-0.113753, 0.476220, -0.000367, 0.000390, 0.000000]

# 相机同理想情况的偏角: yaw0.50 pitch0.89 roll-4.09 degree
# 标定板到世界坐标系原点的水平距离: 1.84 m
# 标定板同竖直摆放时的偏角: yaw21.15 pitch5.80 roll-95.22 degree
R_camera2gimbal:
  [
    -0.0097593608923142363,
    0.014906909346876499,
    0.9998412568646573,
    -0.99740747610409053,
    -0.07143632359391644,
    -0.0086705411049835795,
    0.0712957325976913,
    -0.99733376345389468,
    0.015565435690953719,
  ]
t_camera2gimbal:
  [0.02663681156986614, -0.00018454730148609257, 0.10511518672308437]

#####-----gimbal参数-----#####
com_port: "/dev/ttyUSB0"

#####-----buff_detector参数-----#####
model: "assets/buffer-0624.xml"

#####-----buff_aimer参数-----#####
fire_gap_time: 0.520 # s
predict_time: 0.100 # s

#####-----planner-----#####
fire_thresh: 0.0035

max_yaw_acc: 50
Q_yaw: [9e6, 0]
R_yaw: [1]

max_pitch_acc: 100
Q_pitch: [9e6, 0]
R_pitch: [1]

target:
  is_outpost: false                        # true 强制前哨站模型；false 按观测名自动判断
  q_trans: 1.0                             # 速度随机游走 PSD (m/s)^2/s
  R_trans_diag_: [0.0009, 0.0009, 0.0025]  # R 对角：0.03^2, 0.03^2, 0.05^2
  P0_pos_var_:  [0.0025, 0.0025, 0.0025]   # 初始位置方差 0.05^2
  P0_vel_var_:  1.0                        # 初始速度方差
  max_dt: 0.5                              # 帧间隔超过此值则重建
  max_horizon: 1.0                         # 预测最远时刻
  max_lost: 5                              # 连续丢帧数上限（Tracker 用）
  #前哨站
  q_alpha: 30.0                            # 角加速度 PSD rad^2/s^3
  r_yaw: 0.08                              # 朝向观测噪声 rad
  radius: 0.275                            # 板到旋转轴距离 m（Ø550）
  plate_heights: [-0.102, 0.0, 0.102]         # 三块板高度差 m
  plate_angles_deg: [0.0, 120.0, 240.0]    # 三块板方位角
  center_z_prior: 1.216                   # 初始化选槽用的安装高度 m