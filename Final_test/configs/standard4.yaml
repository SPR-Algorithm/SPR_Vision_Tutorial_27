Q_pitch: [9e6, 0]
R_pitch: [1]

#####-----buff_detector参数-----#####
model: "assets/buffer-0624.xml"

#####-----buff_aimer参数-----#####
fire_gap_time: 0.300   # s
predict_time: 0.120     # s

#####-----滤波器参数集（基于角速度自动切换）-----#####
# 角速度阈值从小到大排列，当前 |w| < threshold 时使用该参数集
# v1: 位置过程噪声（越大跟踪越快但越抖）
# v2: 角度过程噪声（越大角度响应越快）
# R_yaw/R_pitch/R_distance: 观测噪声（越小越信任观测值）
filter_param_sets:
  - name: "slow"
    v1: 10.0
    v2: 0.5
    R_yaw: 0.004
    R_pitch: 0.004
    R_distance: 0.09
    angular_velocity_threshold: 2.0   # |w| < 2 rad/s 时使用此参数集（慢速/旋转目标）
  - name: "normal"
    v1: 100.0
    v2: 400.0
    R_yaw: 0.004
    R_pitch: 0.004
    R_distance: 0.09
    angular_velocity_threshold: 8.0   # 2 <= |w| < 8 时使用（常规目标）
  - name: "fast"
    v1: 500.0
    v2: 1000.0
    R_yaw: 0.002
    R_pitch: 0.002
    R_distance: 0.05
    angular_velocity_threshold: 999.0 # |w| >= 8 时使用（快速平移目标）

target:
  is_outpost: false                        # true 强制前哨站模型；false 按观测名自动判断
  q_trans: 1.0                             # 速度随机游走 PSD (m/s)^2/s
  R_trans_diag_: [0.0009, 0.0009, 0.0025]  # R 对角：0.03^2, 0.03^2, 0.05^2
  P0_pos_var_:  [0.0025, 0.0025, 0.0025]   # 初始位置方差 0.05^2
  P0_vel_var_:  1.0                        # 初始速度方差
  max_dt: 0.5                              # 帧间隔超过此值则重建
  max_horizon: 1.0                         # 预测最远时刻
  max_lost: 5                              # 连续丢帧数上限（Tracker 用）
  #前哨站
  q_alpha: 30.0                            # 角加速度 PSD rad^2/s^3
  r_yaw: 0.08                              # 朝向观测噪声 rad
  radius: 0.275                            # 板到旋转轴距离 m（Ø550）
  plate_heights: [-0.102, 0.0, 0.102]         # 三块板高度差 m
  plate_angles_deg: [0.0, 120.0, 240.0]    # 三块板方位角
  center_z_prior: 1.216                   # 初始化选槽用的安装高度 m